# The Python package: scikit-build-core runs the root CMakeLists.txt, which builds python/ when SKBUILD is defined.
# The version comes from include/gpflash/Version.hpp, as CMake's does, so C++ and Python cannot disagree.

[build-system]
# pybind11 3.0 is the first with Python 3.14 support.
requires = ["scikit-build-core>=1.0", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "gpflash"
dynamic = ["version"]
description = "Fast, exact Gaussian process regression: marginal log-likelihood with analytic gradients, hyperparameter fitting and posterior evaluation."
readme = "python/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES", "python/LICENSES_bundled.txt"]
authors = [{ name = "André Marchildon" }]
keywords = ["gaussian-process", "kriging", "surrogate-model", "bayesian-optimization", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/marchildon/gpflash"
Source = "https://github.com/marchildon/gpflash"
Issues = "https://github.com/marchildon/gpflash/issues"
Paper = "https://arxiv.org/abs/2610.16861"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.22"
build-dir = "build_python/{wheel_tag}"
wheel.packages = ["python/gpflash"]
# Only the module: the headers and CMake package files the root installs are for C++ consumers.
install.components = ["python"]
sdist.exclude = ["/build", "/build_python", "/dist", ".DS_Store"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/gpflash/Version.hpp"
regex = '#define GPFLASH_VERSION_MAJOR (?P<major>[0-9]+)\n#define GPFLASH_VERSION_MINOR (?P<minor>[0-9]+)\n#define GPFLASH_VERSION_PATCH (?P<patch>[0-9]+)'
result = "{major}.{minor}.{patch}"

[tool.pytest.ini_options]
testpaths = ["python/tests"]

# ── Formatting and linting (ruff, pinned in .github/workflows/ci.yml) ────────
# The same 120-column limit as .clang-format. Python code blocks in the READMEs are formatted too, which keeps the quick
# start identical in README.md and python/README.md. _core.pyi is generated by pybind11-stubgen, so it is left as written.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["python/gpflash/_core.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gpflash"]

# ── Wheels (cibuildwheel, run by .github/workflows/wheels.yml) ───────────────
[tool.cibuildwheel]
# CPython 3.11 to 3.14, each runner's own 64-bit architecture, glibc Linux only.
build = "cp311-* cp312-* cp313-* cp314-*"
archs = ["auto64"]
skip = "*-musllinux_*"
test-extras = ["test"]
test-command = "pytest {project}/python/tests"
build-verbosity = 1

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash {project}/python/ci/install_deps_unix.sh"
# LD_LIBRARY_PATH lets auditwheel find the OpenBLAS and HDF5 it copies into the wheel.
environment = { CMAKE_PREFIX_PATH = "/opt/gpflash_deps", BLA_VENDOR = "OpenBLAS", LD_LIBRARY_PATH = "/opt/gpflash_deps/lib:/opt/gpflash_deps/lib64" }

[tool.cibuildwheel.macos]
before-all = "bash {project}/python/ci/install_deps_unix.sh"
# MACOSX_DEPLOYMENT_TARGET is set per runner by the workflow, to match the Homebrew libraries delocate bundles.
environment = { CMAKE_PREFIX_PATH = "/tmp/gpflash_deps", CMAKE_ARGS = "-DOpenMP_ROOT=$(brew --prefix libomp)" }

[tool.cibuildwheel.windows]
before-all = "pwsh -File {project}/python/ci/install_deps_windows.ps1"
before-build = "pip install delvewheel"
environment = { CMAKE_PREFIX_PATH = "C:/gpflash_deps", BLA_VENDOR = "OpenBLAS" }
# --add-path is where delvewheel finds the OpenBLAS and HDF5 DLLs it copies into the wheel.
repair-wheel-command = "delvewheel repair --add-path C:/gpflash_deps/bin -w {dest_dir} {wheel}"
